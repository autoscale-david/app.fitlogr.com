name = "fitlogr"
main = "src/index.ts"
compatibility_date = "2026-11-23"
account_id = "42aad73fe98811972eccd8907196d722"
workers_dev = true

# Static site is served by Workers Assets. /api/* hits this Worker first.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = [ "/api/*" ]
not_found_handling = "404-page"

# database_id is filled in after `wrangler d1 create fitlogr-db`.
# The binding stays commented until the Cloudflare token can create D1,
# so a site deploy is not blocked on that permission.
# [[d1_databases]]
# binding = "DB"
# database_name = "fitlogr-db"
# database_id = "00000000-0000-0000-0000-000000000000"
# migrations_dir = "migrations"

[vars]
GOOGLE_CLOUD_PROJECT_ID = "fitlogr-app"
GOOGLE_OAUTH_REDIRECT_URI = "https://fitlogr.com/api/auth/google/callback"
GOOGLE_PHOTOS_ALBUM_NAME = "fitlogr"
OPENROUTER_BASE_URL = "https://openrouter.ai/api/v1"
OPENROUTER_VISION_MODEL = "google/gemini-2.5-flash-lite"
OPENROUTER_TEXT_MODEL = "google/gemini-2.5-flash-lite"
APP_URL = "https://fitlogr.com"
API_BASE_URL = "https://fitlogr.com/api"
ENVIRONMENT = "production"

[[routes]]
pattern = "fitlogr.com"
custom_domain = true

[[routes]]
pattern = "www.fitlogr.com"
custom_domain = true
