name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Validate D1 migrations in order
        # A block scalar: the trailing colon in ":memory:" is not valid in a plain YAML value.
        run: |
          cat worker/migrations/*.sql | sqlite3 :memory:
